<style>
/* Aislamiento contra estilos de HTML5UP / Massively */
  
/* Prevenir que el texto se superponga con la flecha del select */
.wal3-calc select {
    padding-right: 40px !important; /* Reserva espacio a la derecha para la flecha */
    text-overflow: ellipsis !important; /* Agrega "..." si el texto es demasiado largo */
    white-space: nowrap !important;
}

.wal3-calc {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    color: #ffffff !important;
    box-sizing: border-box !important;
    margin: 2rem 0 !important;
}

.wal3-calc * {
    box-sizing: border-box !important;
}

.wal3-calc .calculator-container {
    max-width: 820px !important;
    margin: 0 auto !important;
    background-color: #1e1e1e !important;
    padding: 30px !important;
    border-radius: 10px !important;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5) !important;
}

.wal3-calc .header-controls {
    margin-bottom: 20px !important;
    border-bottom: 1px solid #333 !important;
    padding-bottom: 15px !important;
}

.wal3-calc .flex-row {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 15px !important;
}

.wal3-calc h2 {
    color: #ffffff !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    border-bottom: none !important;
    margin: 0 !important;
}

/* Reset de Inputs */
.wal3-calc input[type="number"],
.wal3-calc input[type="text"] {
    display: block !important;
    width: 100% !important;
    height: 44px !important;
    padding: 8px 12px !important;
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    border-radius: 5px !important;
    margin-top: 5px !important;
    font-size: 0.95rem !important;
    box-shadow: none !important;
    outline: none !important;
}

/* Reset específico para Selects (Flechitas corregidas) */
.wal3-calc select {
    display: block !important;
    width: 100% !important;
    height: 44px !important;
    padding: 8px 40px 8px 12px !important; /* 40px de espacio a la derecha */
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    border-radius: 5px !important;
    margin-top: 5px !important;
    font-size: 0.95rem !important;
    box-shadow: none !important;
    outline: none !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
}

.wal3-calc select option {
    background: #2c2c2c !important;
    color: #ffffff !important;
}
/* Overrides de Divisas */
.wal3-calc .currency-override {
    background: #252525 !important;
    padding: 15px !important;
    border-radius: 5px !important;
    margin-top: 15px !important;
    font-size: 0.9em !important;
    display: none;
    flex-wrap: wrap !important;
    gap: 10px !important;
    align-items: center !important;
}

.wal3-calc .currency-override.active {
    display: flex !important;
}

.wal3-calc .currency-override input[type="number"] {
    width: 110px !important;
    height: 38px !important;
    margin-top: 0 !important;
}

/* Selector de moneda sin margen superior para alinear con el checkbox */
.wal3-calc .header-controls select {
    margin-top: 0 !important;
}

.wal3-calc .toggle-container {
    margin-top: 0 !important; /* Quitamos el margen que lo tiraba para abajo */
    font-size: 0.85em !important; /* Texto un poquito más sutil */
    color: #aaa !important;
    display: flex !important;
    align-items: center !important; /* Centrado vertical estricto */
    gap: 6px !important; /* Menos separación entre caja y texto */
    height: 44px !important; /* Toma la misma altura que el selector de moneda */
}

.wal3-calc .toggle-container input[type="checkbox"] {
    width: 14px !important; /* Caja más chica y coherente */
    height: 14px !important;
    margin: 0 !important;
    padding: 0 !important;
    opacity: 1 !important;
    position: static !important;
    appearance: checkbox !important;
    -webkit-appearance: checkbox !important;
    cursor: pointer !important;
}

/* Alineación izquierda para el grupo superior */
.wal3-calc .header-controls .flex-row {
    justify-content: flex-start !important;
}

/* Pestañas */
.wal3-calc .tabs {
    display: flex !important;
    gap: 10px !important;
    margin-bottom: 20px !important;
    flex-wrap: wrap !important;
}

.wal3-calc .tab-btn {
    padding: 10px 16px !important;
    background-color: #2c2c2c !important;
    border: none !important;
    color: #ffffff !important;
    cursor: pointer !important;
    border-radius: 5px !important;
    transition: 0.2s !important;
    flex-grow: 1 !important;
    font-size: 0.95rem !important;
    font-weight: 500 !important;
    text-transform: none !important;
    height: auto !important;
    box-shadow: none !important;
}

.wal3-calc .tab-btn.active {
    background-color: #007bff !important;
    font-weight: bold !important;
}

.wal3-calc .tab-content {
    display: none;
    background: #252525 !important;
    padding: 20px !important;
    border-radius: 5px !important;
}

.wal3-calc .tab-content.active {
    display: block !important;
}

/* Grilla Formulario */
.wal3-calc .grid-layout {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 15px 20px !important;
}

.wal3-calc .form-group {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-end !important;
}

.wal3-calc label {
    font-size: 0.85em !important;
    color: #aaa !important;
    margin-bottom: 3px !important;
    line-height: 1.2 !important;
    text-transform: none !important;
    letter-spacing: normal !important;
}

.wal3-calc .links-ref {
    font-size: 0.8em !important;
    color: #4da3ff !important;
    text-decoration: none !important;
    margin-bottom: 20px !important;
    display: inline-block !important;
    border-bottom: none !important;
}

.wal3-calc .links-ref:hover {
    text-decoration: underline !important;
}

/* Área de Totales */
.wal3-calc .result-area {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-top: 25px !important;
    background-color: #004085 !important;
    padding: 18px 22px !important;
    border-radius: 6px !important;
    flex-wrap: wrap !important;
    gap: 15px !important;
}

.wal3-calc .multiplier-box {
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
    color: #ddd !important;
    font-weight: bold !important;
}

.wal3-calc .multiplier-box input {
    width: 80px !important;
    height: 38px !important;
    text-align: center !important;
    margin: 0 !important;
    font-weight: bold !important;
}

.wal3-calc .pdf-btn {
    background: transparent !important;
    border: none !important;
    color: #ffffff !important;
    cursor: pointer !important;
    text-align: right !important;
    transition: 0.2s !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-end !important;
    padding: 0 !important;
    box-shadow: none !important;
    height: auto !important;
}

.wal3-calc .pdf-btn:hover {
    color: #a8d0ff !important;
    transform: scale(1.02) !important;
}

.wal3-calc .pdf-hint {
    font-size: 0.7em !important;
    text-transform: uppercase !important;
    letter-spacing: 1px !important;
    color: #a8d0ff !important;
    margin-bottom: 4px !important;
}

.wal3-calc .pdf-total {
    font-size: 1.8em !important;
    font-weight: bold !important;
    line-height: 1 !important;
}

@media (max-width: 600px) {
    .wal3-calc .grid-layout { grid-template-columns: 1fr !important; }
    .wal3-calc .result-area { flex-direction: column-reverse !important; align-items: stretch !important; text-align: center !important; }
    .wal3-calc .pdf-btn { align-items: center !important; text-align: center !important; margin-bottom: 10px !important; }
    .wal3-calc .multiplier-box { justify-content: center !important; }
}
</style>

<div class="wal3-calc">
    <div class="calculator-container"><div class="header-controls">
            <div class="flex-row">
                <div>
                    <select id="currency" onchange="calcularTodo()" style="width: auto !important;">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="ARS">ARS ($)</option>
                    </select>
                </div>
                
                <div class="toggle-container">
                    <input type="checkbox" id="override_toggle" onchange="toggleManualRates()">
                    <label for="override_toggle" style="display:inline !important; margin:0 !important; cursor:pointer; line-height: 1 !important;">Override</label>
                </div>
            </div>
            
            <div class="currency-override" id="manual_rates_div">
                <span>1 USD = </span>
                <input type="number" id="manual_eur" placeholder="0.92" step="0.01" oninput="calcularTodo()"> <span>€</span>
                <span style="margin-left: 10px;">1 USD = </span>
                <input type="number" id="manual_ars" placeholder="1000~1300" step="1" oninput="calcularTodo()"> <span>$ ARS</span>
            </div>
        </div>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'tab-musica')">Música</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-diseno-lineal')">Cine / TV</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-vgm')">Videojuegos</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-mezcla')">Mezcla / Master</button>
        </div>

        <!-- 1. Pestaña: Música -->
        <div id="tab-musica" class="tab-content active" data-tab-name="Composición Musical">
            <a href="https://www.audiogang.org/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 Referencia G.A.N.G. (Tarifas Globales)</a>
            
            <div class="grid-layout">
                <div class="form-group base-price-group">
                    <label>Tarifa Base por Minuto (USD)</label>
                    <input type="number" id="musica_tarifa" placeholder="150~500" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Cantidad de Minutos</label>
                    <input type="number" id="musica_minutos" placeholder="1~5" step="0.1" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Estilo / Complejidad</label>
                    <select id="musica_estilo" onchange="calcularTodo()">
                        <option value="1">Electrónica / Rock / Minimalista (1x)</option>
                        <option value="1.5">Orquestal Virtual (Mockup) (1.5x)</option>
                        <option value="2.5">Híbrido Complejo / Grabación (2.5x)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de Licencia</label>
                    <select id="musica_licencia" onchange="calcularTodo()">
                        <option value="1">Sincronización Estándar (No exclusiva) (1x)</option>
                        <option value="1.5">Sinc. Exclusiva (Solo para este proyecto/medio) (1.5x)</option>
                        <option value="2">Exclusividad Temporal Global (Ej: 2 a 5 años) (2x)</option>
                        <option value="3.5">Buyout Total (Cesión total de derechos) (3.5x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. Pestaña: Cine / TV -->
        <div id="tab-diseno-lineal" class="tab-content" data-tab-name="Diseño Sonoro para Cine y TV">
            <a href="https://www.sicaapma.com.ar/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 Referencia SICA APMA (Escalas)</a>
            
            <div class="grid-layout">
                <div class="form-group base-price-group">
                    <label>Honorarios Base por Jornada (USD)</label>
                    <input type="number" id="lineal_tarifa" placeholder="150~300" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Cantidad de Jornadas Estimadas</label>
                    <input type="number" id="lineal_jornadas" placeholder="1~10" oninput="calcularTodo()">
                </div>
                <div class="form-group base-price-group">
                    <label>Valor Total del Equipo Propio a usar (USD)</label>
                    <input type="number" id="lineal_equipo_valor" placeholder="1000~5000" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Porcentaje de Alquiler de Equipo por Jornada (%)</label>
                    <input type="number" id="lineal_equipo_porcentaje" placeholder="2~5" oninput="calcularTodo()">
                </div>
            </div>
        </div>

        <!-- 3. Pestaña: VGM -->
        <div id="tab-vgm" class="tab-content" data-tab-name="Diseño Sonoro para Videojuegos">
            <a href="https://www.audiogang.org/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 Referencia G.A.N.G. (Tarifas Globales)</a>
            
            <div class="grid-layout">
                <div class="form-group base-price-group">
                    <label>Precio Base por Asset Principal (USD)</label>
                    <input type="number" id="vgm_tarifa" placeholder="20~100" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Cantidad de Assets Principales</label>
                    <input type="number" id="vgm_assets" placeholder="1~50" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Variantes (Múltiples versiones)</label>
                    <input type="number" id="vgm_variantes" placeholder="1~200" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Precio Variantes (% del Asset Principal)</label>
                    <select id="vgm_variante_mult" onchange="calcularTodo()">
                        <option value="0.2">20% del valor base (Estándar)</option>
                        <option value="0.3">30% del valor base</option>
                        <option value="0.5">50% del valor base</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. Pestaña: Mezcla -->
        <div id="tab-mezcla" class="tab-content" data-tab-name="Mezcla y Masterización">
            <a href="https://soundlister.com/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 Referencia Soundlister (Mercado Global)</a>
            
            <div class="grid-layout">
                <div class="form-group base-price-group">
                    <label>Tarifa Base (Por Minuto / Track) (USD)</label>
                    <input type="number" id="mezcla_tarifa" placeholder="50~200" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Cantidad (Minutos o Tracks)</label>
                    <input type="number" id="mezcla_cantidad" placeholder="1~10" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Formato de Entrega</label>
                    <select id="mezcla_formato" onchange="calcularTodo()">
                        <option value="1">Estéreo 2.0 (1x)</option>
                        <option value="1.5">Surround 5.1 (1.5x)</option>
                        <option value="2.5">Dolby Atmos (2.5x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div class="result-area">
            <div class="multiplier-box" title="Ajuste porcentual sobre el total">
                <input type="number" id="porcentaje_ajuste" value="100" oninput="calcularTodo()"> <span>%</span>
            </div>
            
            <button class="pdf-btn" onclick="generarPDF()">
                <span class="pdf-hint">📄 Exportar PDF</span>
                <span class="pdf-total"><span id="precio_total">0.00</span> <span id="moneda_label">USD</span></span>
            </button>
        </div>
    </div>
</div>

<script>
    const MODO_CALCULADORA = 'B'; 
    const PRECIOS_DEFAULT = { musica: 150, lineal_jornada: 200, lineal_equipo: 3000, vgm_asset: 30, mezcla: 80 };
    let exchangeRates = { USD: 1, EUR: 0.92, ARS: 1100 }; 
    let useManualRates = false;
    let currentActiveTabId = 'tab-musica';

    document.addEventListener("DOMContentLoaded", async function() {
        aplicarModoVista();
        await obtenerDivisasAPI();
        calcularTodo();
    });

    function aplicarModoVista() {
        if (MODO_CALCULADORA === 'A') {
            document.querySelectorAll('.wal3-calc .base-price-group').forEach(group => { 
                group.style.display = 'none'; 
            });
        }
    }

    async function obtenerDivisasAPI() {
        try {
            let res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            let data = await res.json();
            exchangeRates.EUR = data.rates.EUR;
            exchangeRates.ARS = data.rates.ARS;
            let mEur = document.getElementById('manual_eur');
            let mArs = document.getElementById('manual_ars');
            if (mEur) mEur.value = exchangeRates.EUR.toFixed(2);
            if (mArs) mArs.value = exchangeRates.ARS.toFixed(2);
        } catch (error) { 
            console.error("Error al cargar divisas.", error); 
        }
    }

    function toggleManualRates() {
        useManualRates = document.getElementById("override_toggle").checked;
        document.getElementById("manual_rates_div").classList.toggle("active", useManualRates);
        calcularTodo();
    }

    function openTab(evt, tabName) {
        document.querySelectorAll(".wal3-calc .tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".wal3-calc .tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
        currentActiveTabId = tabName;
        calcularTodo();
    }

    function calcularTodo() {
        let monedaEl = document.getElementById("currency");
        if (!monedaEl) return;
        let moneda = monedaEl.value;
        
        let rateEUR = useManualRates ? (parseFloat(document.getElementById("manual_eur").value) || exchangeRates.EUR) : exchangeRates.EUR;
        let rateARS = useManualRates ? (parseFloat(document.getElementById("manual_ars").value) || exchangeRates.ARS) : exchangeRates.ARS;
        
        let multMoneda = (moneda === 'EUR') ? rateEUR : ((moneda === 'ARS') ? rateARS : 1);
        let totalUSD = 0;

        if (currentActiveTabId === 'tab-musica') {
            let base = MODO_CALCULADORA === 'B' ? (parseFloat(document.getElementById("musica_tarifa").value) || 0) : PRECIOS_DEFAULT.musica;
            totalUSD = base * (parseFloat(document.getElementById("musica_minutos").value) || 0) * 
                       parseFloat(document.getElementById("musica_estilo").value) * 
                       parseFloat(document.getElementById("musica_licencia").value);
        } 
        else if (currentActiveTabId === 'tab-diseno-lineal') {
            let jorBase = MODO_CALCULADORA === 'B' ? (parseFloat(document.getElementById("lineal_tarifa").value) || 0) : PRECIOS_DEFAULT.lineal_jornada;
            let jor = parseFloat(document.getElementById("lineal_jornadas").value) || 0;
            let eqVal = MODO_CALCULADORA === 'B' ? (parseFloat(document.getElementById("lineal_equipo_valor").value) || 0) : PRECIOS_DEFAULT.lineal_equipo;
            let eqPorc = parseFloat(document.getElementById("lineal_equipo_porcentaje").value) || 2;
            totalUSD = (jorBase * jor) + (eqVal * (eqPorc / 100) * jor);
        }
        else if (currentActiveTabId === 'tab-vgm') {
            let base = MODO_CALCULADORA === 'B' ? (parseFloat(document.getElementById("vgm_tarifa").value) || 0) : PRECIOS_DEFAULT.vgm_asset;
            let assets = parseFloat(document.getElementById("vgm_assets").value) || 0;
            let vars = parseFloat(document.getElementById("vgm_variantes").value) || 0;
            let varMult = parseFloat(document.getElementById("vgm_variante_mult").value);
            totalUSD = (base * assets) + ((base * varMult) * vars);
        }
        else if (currentActiveTabId === 'tab-mezcla') {
            let base = MODO_CALCULADORA === 'B' ? (parseFloat(document.getElementById("mezcla_tarifa").value) || 0) : PRECIOS_DEFAULT.mezcla;
            totalUSD = base * (parseFloat(document.getElementById("mezcla_cantidad").value) || 0) * 
                       parseFloat(document.getElementById("mezcla_formato").value);
        }

        let porcentajeAjuste = parseFloat(document.getElementById("porcentaje_ajuste").value) || 100;
        let totalFinal = (totalUSD * multMoneda) * (porcentajeAjuste / 100);
        
        let formato = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(totalFinal);
        
        document.getElementById("precio_total").innerText = formato;
        document.getElementById("moneda_label").innerText = moneda;
    }

    function generarPDF() {
        const divPdf = document.createElement('div');
        divPdf.style.padding = '40px';
        divPdf.style.fontFamily = 'Helvetica, Arial, sans-serif';
        divPdf.style.color = '#333';
        divPdf.style.background = '#ffffff';

        let activeTab = document.getElementById(currentActiveTabId);
        let tabName = activeTab.getAttribute('data-tab-name');
        let totalStr = document.getElementById("precio_total").innerText;
        let monedaStr = document.getElementById("moneda_label").innerText;
        let porcentajeAjuste = document.getElementById("porcentaje_ajuste").value;
        let fecha = new Date().toLocaleDateString('es-ES');

        let html = `
            <div style="border-bottom: 2px solid #004085; padding-bottom: 10px; margin-bottom: 20px;">
                <h1 style="color: #004085; margin: 0; font-size: 24px;">Presupuesto de Servicios de Audio</h1>
                <p style="margin: 5px 0 0 0; color: #666; font-size: 14px;">Fecha de emisión: ${fecha}</p>
            </div>
            <h2 style="color: #333; margin-bottom: 15px; font-size: 18px;">Servicio: ${tabName}</h2>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                <tbody>
        `;

        let formGroups = activeTab.querySelectorAll('.form-group');
        formGroups.forEach(group => {
            if(window.getComputedStyle(group).display !== 'none') {
                let label = group.querySelector('label').innerText;
                let input = group.querySelector('input, select');
                let value = input.tagName === 'SELECT' ? input.options[input.selectedIndex].text : (input.value || "0");
                
                html += `
                    <tr>
                        <td style="padding: 10px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 14px;">${label}</td>
                        <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right; font-size: 14px;">${value}</td>
                    </tr>
                `;
            }
        });

        html += `</tbody></table>`;

        if(porcentajeAjuste !== "100") {
            html += `<p style="text-align: right; color: #666; font-size: 0.9em;">(Ajuste aplicado de presupuesto: ${porcentajeAjuste}%)</p>`;
        }

        html += `
            <div style="background: #f8f9fa; padding: 20px; text-align: right; border-radius: 5px;">
                <h2 style="margin: 0; color: #004085; font-size: 20px;">TOTAL ESTIMADO: ${totalStr} ${monedaStr}</h2>
            </div>
            <p style="margin-top: 50px; text-align: center; font-size: 0.8em; color: #999;">
                Este documento es un presupuesto estimado. Valores sujetos a revisión del proyecto final.
            </p>
        `;

        divPdf.innerHTML = html;

        var opt = {
            margin:       0.5,
            filename:     `Presupuesto_${tabName.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(divPdf).save();
    }
</script>
