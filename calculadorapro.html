<style>

/* Form Grid */

<div class="wal3-calc">
    <div class="calculator-container">
        <div class="header-controls">
            <div class="flex-row">
                <div>
                    <select id="currency" onchange="calcularTodo()" style="width: auto !important;">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="ARS">ARS ($)</option>
                    </select>
                </div>
                
                <div class="toggle-container admin-only">
                    <input type="checkbox" id="override_toggle" onchange="toggleManualRates()">
                    <label for="override_toggle" style="display:inline !important; margin:0 !important; cursor:pointer; line-height: 1 !important;">Override</label>
                </div>
            </div>
            
            <div class="currency-override admin-only" id="manual_rates_div">
                <span>1 USD = </span>
                <input type="number" id="manual_eur" placeholder="0.92" step="0.01" oninput="calcularTodo()"> <span>€</span>
                <span style="margin-left: 10px;">1 USD = </span>
                <input type="number" id="manual_ars" placeholder="1000~1300" step="1" oninput="calcularTodo()"> <span>$ ARS</span>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'tab-musica')">Music</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-diseno-lineal')">Location Sound</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-foley')">Foley & SFX</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-mezcla')">Mix / Master</button>
        </div>

        <!-- 1. Tab: Music -->
        <div id="tab-musica" class="tab-content active" data-tab-name="Music Composition">
            <a href="https://www.audiogang.org/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 G.A.N.G. Reference (Global Rates)</a>
            
            <div class="grid-layout">
                <div class="form-group admin-only">
                    <label>Base Rate per Minute (USD)</label>
                    <input type="number" id="musica_tarifa" value="150" placeholder="150~500" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Amount of Minutes</label>
                    <input type="number" id="musica_minutos" value="1" placeholder="1~5" step="0.1" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Style / Complexity</label>
                    <select id="musica_estilo" onchange="calcularTodo()">
                        <option value="1">Electronic / Rock / Minimalist (1x)</option>
                        <option value="1.5">Virtual Orchestral (Mockup) (1.5x)</option>
                        <option value="2.5">Complex Hybrid / Recording (2.5x)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Format / Integration</label>
                    <select id="musica_formato" onchange="calcularTodo()">
                        <option value="1">Picture Lock / Linear (1x)</option>
                        <option value="1.15">Seamless Loop (1.15x)</option>
                        <option value="1.5">Adaptable / Interactive Stems (1.5x)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>License Type</label>
                    <select id="musica_licencia" onchange="calcularTodo()">
                        <option value="1">Standard Sync (Non-exclusive) (1x)</option>
                        <option value="1.5">Exclusive Sync (Single project/media) (1.5x)</option>
                        <option value="2">Global Temporal Exclusivity (e.g., 2-5 years) (2x)</option>
                        <option value="3.5">Total Buyout (Full rights transfer) (3.5x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. Tab: Location Sound -->
        <div id="tab-diseno-lineal" class="tab-content" data-tab-name="Location Sound">
            <a href="https://www.sicaapma.com.ar/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 SICA APMA Reference (Scales)</a>
            
            <div class="grid-layout">
                <div class="form-group admin-only">
                    <label>Base Fee per Day (USD)</label>
                    <input type="number" id="lineal_tarifa" value="200" placeholder="150~300" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Estimated Number of Days</label>
                    <input type="number" id="lineal_jornadas" value="1" placeholder="1~10" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Include Equipment Rental?</label>
                    <select id="lineal_include_equipo" onchange="calcularTodo()">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="form-group admin-only">
                    <label>Total Value of Own Equipment to Use (USD)</label>
                    <input type="number" id="lineal_equipo_valor" value="3000" placeholder="1000~5000" oninput="calcularTodo()">
                </div>
                <div class="form-group admin-only">
                    <label>Equipment Rental Percentage per Day (%)</label>
                    <input type="number" id="lineal_equipo_porcentaje" value="2" placeholder="2~5" oninput="calcularTodo()">
                </div>
            </div>
        </div>

        <!-- 3. Tab: Foley & SFX -->
        <div id="tab-foley" class="tab-content" data-tab-name="Foley & Sound Effects">
            <a href="https://www.audiogang.org/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 G.A.N.G. Reference (Global Rates)</a>
            
            <div class="grid-layout">
                <!-- Method Selection -->
                <div class="form-group">
                    <label>Calculation Method</label>
                    <select id="foley_method" onchange="toggleFoleyMethod(); calcularTodo()">
                        <option value="sfx">By SFX (Assets)</option>
                        <option value="minute">By Minute</option>
                    </select>
                </div>
                
                <!-- Blank space to maintain grid parity if needed, or let natural flow occur -->
                <div class="form-group"></div>

                <!-- Fields: By SFX -->
                <div class="form-group foley-sfx-field admin-only">
                    <label>Base Price per SFX (USD)</label>
                    <input type="number" id="foley_tarifa_sfx" value="30" placeholder="20~100" oninput="calcularTodo()">
                </div>
                <div class="form-group foley-sfx-field">
                    <label>Number of SFX</label>
                    <input type="number" id="foley_cantidad_sfx" value="1" placeholder="1~50" oninput="calcularTodo()">
                </div>
                <div class="form-group foley-sfx-field">
                    <label>Variations (per SFX)</label>
                    <input type="number" id="foley_variantes" value="0" placeholder="0~200" oninput="calcularTodo()">
                </div>
                <div class="form-group foley-sfx-field admin-only">
                    <label>Variations Price (% of Base)</label>
                    <select id="foley_variante_mult" onchange="calcularTodo()">
                        <option value="0.2">20% of base (Standard)</option>
                        <option value="0.3">30% of base</option>
                        <option value="0.5">50% of base</option>
                    </select>
                </div>

                <!-- Fields: By Minute -->
                <div class="form-group foley-min-field admin-only hidden-field">
                    <label>Base Price per Minute (USD)</label>
                    <input type="number" id="foley_tarifa_minuto" value="150" placeholder="100~300" oninput="calcularTodo()">
                </div>
                <div class="form-group foley-min-field hidden-field">
                    <label>Amount of Minutes</label>
                    <input type="number" id="foley_minutos" value="1" placeholder="1~10" oninput="calcularTodo()">
                </div>
                <div class="form-group foley-min-field hidden-field">
                    <label>Complexity / Density</label>
                    <select id="foley_complejidad" onchange="calcularTodo()">
                        <option value="1">Low / Sparse (1x)</option>
                        <option value="1.5">Medium / Average (1.5x)</option>
                        <option value="2">High / Action-packed (2x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. Tab: Mix -->
        <div id="tab-mezcla" class="tab-content" data-tab-name="Mixing and Mastering">
            <a href="https://soundlister.com/" target="_blank" rel="noopener noreferrer" class="links-ref">🔗 Soundlister Reference (Global Market)</a>
            
            <div class="grid-layout">
                <div class="form-group admin-only">
                    <label>Base Rate (Per Minute / Track) (USD)</label>
                    <input type="number" id="mezcla_tarifa" value="80" placeholder="50~200" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Quantity (Minutes or Tracks)</label>
                    <input type="number" id="mezcla_cantidad" value="1" placeholder="1~10" oninput="calcularTodo()">
                </div>
                <div class="form-group">
                    <label>Delivery Format</label>
                    <select id="mezcla_formato" onchange="calcularTodo()">
                        <option value="1">Stereo 2.0 (1x)</option>
                        <option value="1.5">Surround 5.1 (1.5x)</option>
                        <option value="2.5">Dolby Atmos (2.5x)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="result-area">
            <div class="multiplier-box admin-only" title="Percentage adjustment on total">
                <input type="number" id="porcentaje_ajuste" value="100" oninput="calcularTodo()"> <span>%</span>
            </div>
            
            <button class="pdf-btn" onclick="generarPDF()">
                <span class="pdf-hint">📄 Export PDF</span>
                <span class="pdf-total"><span id="precio_total">0.00</span> <span id="moneda_label">USD</span></span>
            </button>
        </div>
    </div>
</div>

<script>
    // 'A' = Cliente (Solo cantidades, oculta tarifas base)
    // 'B' = Administrador (Puede editar tarifas base y divisas)
    const MODO_CALCULADORA = 'B'; 
    
    let exchangeRates = { USD: 1, EUR: 0.92, ARS: 1100 }; 
    let useManualRates = false;
    let currentActiveTabId = 'tab-musica';

    document.addEventListener("DOMContentLoaded", async function() {
        aplicarModoVista();
        toggleFoleyMethod(); // Estado inicial
        await obtenerDivisasAPI();
        calcularTodo();
    });

    function aplicarModoVista() {
        let calculadora = document.querySelector('.wal3-calc');
        if (MODO_CALCULADORA === 'A') {
            calculadora.classList.add('mode-a');
        } else {
            calculadora.classList.remove('mode-a');
        }
    }

    async function obtenerDivisasAPI() {
        try {
            let res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            let data = await res.json();
            exchangeRates.EUR = data.rates.EUR;
            exchangeRates.ARS = data.rates.ARS;
            let mEur = document.getElementById('manual_eur');
            let mArs = document.getElementById('manual_ars');
            if (mEur) mEur.value = exchangeRates.EUR.toFixed(2);
            if (mArs) mArs.value = exchangeRates.ARS.toFixed(2);
        } catch (error) { 
            console.error("Error al cargar divisas.", error); 
        }
    }

    function toggleManualRates() {
        useManualRates = document.getElementById("override_toggle").checked;
        document.getElementById("manual_rates_div").classList.toggle("active", useManualRates);
        calcularTodo();
    }

    function toggleFoleyMethod() {
        let method = document.getElementById("foley_method").value;
        let sfxFields = document.querySelectorAll('.foley-sfx-field');
        let minFields = document.querySelectorAll('.foley-min-field');
        
        if (method === 'sfx') {
            sfxFields.forEach(el => el.classList.remove('hidden-field'));
            minFields.forEach(el => el.classList.add('hidden-field'));
        } else {
            sfxFields.forEach(el => el.classList.add('hidden-field'));
            minFields.forEach(el => el.classList.remove('hidden-field'));
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll(".wal3-calc .tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".wal3-calc .tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
        currentActiveTabId = tabName;
        calcularTodo();
    }

    function calcularTodo() {
        let monedaEl = document.getElementById("currency");
        if (!monedaEl) return;
        let moneda = monedaEl.value;
        
        let rateEUR = useManualRates ? (parseFloat(document.getElementById("manual_eur").value) || exchangeRates.EUR) : exchangeRates.EUR;
        let rateARS = useManualRates ? (parseFloat(document.getElementById("manual_ars").value) || exchangeRates.ARS) : exchangeRates.ARS;
        
        let multMoneda = (moneda === 'EUR') ? rateEUR : ((moneda === 'ARS') ? rateARS : 1);
        let totalUSD = 0;

        if (currentActiveTabId === 'tab-musica') {
            let base = parseFloat(document.getElementById("musica_tarifa").value) || 150;
            let minutos = parseFloat(document.getElementById("musica_minutos").value) || 0;
            let estilo = parseFloat(document.getElementById("musica_estilo").value) || 1;
            let formato = parseFloat(document.getElementById("musica_formato").value) || 1;
            let licencia = parseFloat(document.getElementById("musica_licencia").value) || 1;
            totalUSD = base * minutos * estilo * formato * licencia;
        } 
        else if (currentActiveTabId === 'tab-diseno-lineal') {
            let jorBase = parseFloat(document.getElementById("lineal_tarifa").value) || 200;
            let jor = parseFloat(document.getElementById("lineal_jornadas").value) || 0;
            
            // Logica de Equipamiento
            let eqVal = parseFloat(document.getElementById("lineal_equipo_valor").value) || 3000;
            let eqPorc = parseFloat(document.getElementById("lineal_equipo_porcentaje").value) || 2;
            let includeEq = parseFloat(document.getElementById("lineal_include_equipo").value) || 0; 
            
            totalUSD = (jorBase * jor) + (eqVal * (eqPorc / 100) * jor * includeEq);
        }
        else if (currentActiveTabId === 'tab-foley') {
            let method = document.getElementById("foley_method").value;
            if (method === 'sfx') {
                let base = parseFloat(document.getElementById("foley_tarifa_sfx").value) || 30;
                let assets = parseFloat(document.getElementById("foley_cantidad_sfx").value) || 0;
                let vars = parseFloat(document.getElementById("foley_variantes").value) || 0;
                let varMult = parseFloat(document.getElementById("foley_variante_mult").value) || 0.2;
                totalUSD = (base * assets) + ((base * varMult) * vars);
            } else {
                let base = parseFloat(document.getElementById("foley_tarifa_minuto").value) || 150;
                let minutos = parseFloat(document.getElementById("foley_minutos").value) || 0;
                let complejidad = parseFloat(document.getElementById("foley_complejidad").value) || 1;
                totalUSD = base * minutos * complejidad;
            }
        }
        else if (currentActiveTabId === 'tab-mezcla') {
            let base = parseFloat(document.getElementById("mezcla_tarifa").value) || 80;
            let cantidad = parseFloat(document.getElementById("mezcla_cantidad").value) || 0;
            let formato = parseFloat(document.getElementById("mezcla_formato").value) || 1;
            totalUSD = base * cantidad * formato;
        }

        let porcentajeAjuste = parseFloat(document.getElementById("porcentaje_ajuste").value) || 100;
        let totalFinal = (totalUSD * multMoneda) * (porcentajeAjuste / 100);
        
        let formatoStr = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(totalFinal);
        
        document.getElementById("precio_total").innerText = formatoStr;
        document.getElementById("moneda_label").innerText = moneda;
    }

    function generarPDF() {
        const divPdf = document.createElement('div');
        divPdf.style.padding = '40px';
        divPdf.style.fontFamily = 'Helvetica, Arial, sans-serif';
        divPdf.style.color = '#333';
        divPdf.style.background = '#ffffff';

        let activeTab = document.getElementById(currentActiveTabId);
        let tabName = activeTab.getAttribute('data-tab-name');
        let totalStr = document.getElementById("precio_total").innerText;
        let monedaStr = document.getElementById("moneda_label").innerText;
        let porcentajeAjuste = document.getElementById("porcentaje_ajuste").value;
        let fecha = new Date().toLocaleDateString('en-US');

        let html = `
            <div style="border-bottom: 2px solid #004085; padding-bottom: 10px; margin-bottom: 20px;">
                <h1 style="color: #004085; margin: 0; font-size: 24px;">Audio Services Estimate</h1>
                <p style="margin: 5px 0 0 0; color: #666; font-size: 14px;">Date of issue: ${fecha}</p>
            </div>
            <h2 style="color: #333; margin-bottom: 15px; font-size: 18px;">Service: ${tabName}</h2>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                <tbody>
        `;

        let formGroups = activeTab.querySelectorAll('.form-group');
        formGroups.forEach(group => {
            // Ignorar los espacios en blanco que usamos para acomodar la grilla y aquellos ocultos
            if(group.innerHTML.trim() !== '' && window.getComputedStyle(group).display !== 'none') {
                let label = group.querySelector('label').innerText;
                let input = group.querySelector('input, select');
                let value = input.tagName === 'SELECT' ? input.options[input.selectedIndex].text : (input.value || "0");
                
                html += `
                    <tr>
                        <td style="padding: 10px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 14px;">${label}</td>
                        <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right; font-size: 14px;">${value}</td>
                    </tr>
                `;
            }
        });

        html += `</tbody></table>`;

        if(porcentajeAjuste !== "100" && MODO_CALCULADORA !== 'A') {
            html += `<p style="text-align: right; color: #666; font-size: 0.9em;">(Applied budget adjustment: ${porcentajeAjuste}%)</p>`;
        }

        html += `
            <div style="background: #f8f9fa; padding: 20px; text-align: right; border-radius: 5px;">
                <h2 style="margin: 0; color: #004085; font-size: 20px;">ESTIMATED TOTAL: ${totalStr} ${monedaStr}</h2>
            </div>
            <p style="margin-top: 50px; text-align: center; font-size: 0.8em; color: #999;">
                This document is an estimated budget. Values are subject to review of the final project.
            </p>
        `;

        divPdf.innerHTML = html;

        var opt = {
            margin:       0.5,
            filename:     `Estimate_${tabName.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(divPdf).save();
    }
</script>
