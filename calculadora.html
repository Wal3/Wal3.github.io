<style>
/* Isolation against HTML5UP / Massively styles */
  
/* Prevent text from overlapping with the select arrow */
.wal3-calc select {
    padding-right: 40px !important; 
    text-overflow: ellipsis !important; 
    white-space: nowrap !important;
}

.wal3-calc {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    color: #ffffff !important;
    box-sizing: border-box !important;
    margin: 2rem 0 !important;
}

.wal3-calc * {
    box-sizing: border-box !important;
}

.wal3-calc .calculator-container {
    max-width: 820px !important;
    margin: 0 auto !important;
    background-color: #1e1e1e !important;
    padding: 30px !important;
    border-radius: 10px !important;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5) !important;
}

.wal3-calc .header-controls {
    margin-bottom: 20px !important;
    border-bottom: 1px solid #333 !important;
    padding-bottom: 15px !important;
}

.wal3-calc .flex-row {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 15px !important;
}

.wal3-calc h2 {
    color: #ffffff !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    border-bottom: none !important;
    margin: 0 !important;
}

/* Inputs Reset */
.wal3-calc input[type="number"],
.wal3-calc input[type="text"] {
    display: block !important;
    width: 100% !important;
    height: 44px !important;
    padding: 8px 12px !important;
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    border-radius: 5px !important;
    margin-top: 5px !important;
    font-size: 0.95rem !important;
    box-shadow: none !important;
    outline: none !important;
}

/* Specific Reset for Selects */
.wal3-calc select {
    display: block !important;
    width: 100% !important;
    height: 44px !important;
    padding: 8px 40px 8px 12px !important; 
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    border-radius: 5px !important;
    margin-top: 5px !important;
    font-size: 0.95rem !important;
    box-shadow: none !important;
    outline: none !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
}

.wal3-calc select option {
    background: #2c2c2c !important;
    color: #ffffff !important;
}

/* Currency Overrides */
.wal3-calc .currency-override {
    background: #252525 !important;
    padding: 15px !important;
    border-radius: 5px !important;
    margin-top: 15px !important;
    font-size: 0.9em !important;
    display: none;
    flex-wrap: wrap !important;
    gap: 10px !important;
    align-items: center !important;
}

.wal3-calc .currency-override.active {
    display: flex !important;
}

.wal3-calc .currency-override input[type="number"] {
    width: 110px !important;
    height: 38px !important;
    margin-top: 0 !important;
}

.wal3-calc .header-controls select {
    margin-top: 0 !important;
}

.wal3-calc .toggle-container {
    margin-top: 0 !important; 
    font-size: 0.85em !important; 
    color: #aaa !important;
    display: flex !important;
    align-items: center !important; 
    gap: 6px !important; 
    height: 44px !important; 
}

.wal3-calc .toggle-container input[type="checkbox"] {
    width: 14px !important; 
    height: 14px !important;
    margin: 0 !important;
    padding: 0 !important;
    opacity: 1 !important;
    position: static !important;
    appearance: checkbox !important;
    -webkit-appearance: checkbox !important;
    cursor: pointer !important;
}

.wal3-calc .header-controls .flex-row {
    justify-content: flex-start !important;
}

/* Tabs */
.wal3-calc .tabs {
    display: flex !important;
    gap: 10px !important;
    margin-bottom: 20px !important;
    flex-wrap: wrap !important;
}

.wal3-calc .tab-btn {
    padding: 10px 16px !important;
    background-color: #2c2c2c !important;
    border: none !important;
    color: #ffffff !important;
    cursor: pointer !important;
    border-radius: 5px !important;
    transition: 0.2s !important;
    flex-grow: 1 !important;
    font-size: 0.95rem !important;
    font-weight: 500 !important;
    text-transform: none !important;
    height: auto !important;
    box-shadow: none !important;
}

.wal3-calc .tab-btn.active {
    background-color: #007bff !important;
    font-weight: bold !important;
}

.wal3-calc .tab-content {
    display: none;
    background: #252525 !important;
    padding: 20px !important;
    border-radius: 5px !important;
}

.wal3-calc .tab-content.active {
    display: block !important;
}

/* Grid Layout */
.wal3-calc .grid-layout {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 15px 20px !important;
}

.wal3-calc .form-group {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-end !important;
}

.wal3-calc label {
    font-size: 0.85em !important;
    color: #aaa !important;
    margin-bottom: 3px !important;
    line-height: 1.2 !important;
    text-transform: none !important;
    letter-spacing: normal !important;
}

.wal3-calc .links-ref {
    font-size: 0.8em !important;
    color: #4da3ff !important;
    text-decoration: none !important;
    margin-bottom: 20px !important;
    display: inline-block !important;
    border-bottom: none !important;
}

.wal3-calc .links-ref:hover {
    text-decoration: underline !important;
}

/* Totals Area */
.wal3-calc .result-area {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-top: 25px !important;
    background-color: #004085 !important;
    padding: 18px 22px !important;
    border-radius: 6px !important;
    flex-wrap: wrap !important;
    gap: 15px !important;
}

.wal3-calc .multiplier-box {
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
    color: #ddd !important;
    font-weight: bold !important;
}

.wal3-calc .multiplier-box input {
    width: 80px !important;
    height: 38px !important;
    text-align: center !important;
    margin: 0 !important;
    font-weight: bold !important;
}

.wal3-calc .pdf-btn {
    background: transparent !important;
    border: none !important;
    color: #ffffff !important;
    cursor: pointer !important;
    text-align: right !important;
    transition: 0.2s !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-end !important;
    padding: 0 !important;
    box-shadow: none !important;
    height: auto !important;
}

.wal3-calc .pdf-btn:hover {
    color: #a8d0ff !important;
    transform: scale(1.02) !important;
}

.wal3-calc .pdf-hint {
    font-size: 0.7em !important;
    text-transform: uppercase !important;
    letter-spacing: 1px !important;
    color: #a8d0ff !important;
    margin-bottom: 4px !important;
}

.wal3-calc .pdf-total {
    font-size: 1.8em !important;
    font-weight: bold !important;
    line-height: 1 !important;
}

@media (max-width: 600px) {
    .wal3-calc .grid-layout { grid-template-columns: 1fr !important; }
    .wal3-calc .result-area { flex-direction: column-reverse !important; align-items: stretch !important; text-align: center !important; }
    .wal3-calc .pdf-btn { align-items: center !important; text-align: center !important; margin-bottom: 10px !important; }
    .wal3-calc .multiplier-box { justify-content: center !important; }
}
</style>
